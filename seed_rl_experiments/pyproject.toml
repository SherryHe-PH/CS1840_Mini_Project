[build-system]
requires = ["setuptools==65.5.0", "wheel==0.38.4"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-on-policy-study"
version = "0.1.0"
description = "CPU experiment design using the original Google Seed RL PPO backend"
requires-python = ">=3.8,<3.9"
dependencies = ["PyYAML==6.0.1"]

[tool.setuptools.packages.find]
include = ["seed_ppo*"]

[tool.pytest.ini_options]
testpaths = ["tests/study"]
pythonpath = ["."]

